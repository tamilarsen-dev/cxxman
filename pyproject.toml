
[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cxxman"
version = "0.1.0"
description = "A terminal-based C++ documentation viewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.15,<5", "httpx>=0.28.1,<1", "rich>=14,<16"]

[project.scripts]
cxxman = "cxxman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
