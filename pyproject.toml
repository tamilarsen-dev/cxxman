
[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "cxxman"
version = "0.3.1"
description = "A terminal-based C++ documentation viewer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["beautifulsoup4>=4.15,<5", "httpx>=0.28.1,<1", "rich>=14,<16"]

[project.optional-dependencies]
dev = ["pytest>=9,<10"]
build = ["pyinstaller>=6.22,<7"]

[project.scripts]
cxxman = "cxxman.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cxxman = ["data/*.json", "data/*.txt"]
