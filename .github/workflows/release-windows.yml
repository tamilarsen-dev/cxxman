name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Install project and build tools
        run: python -m pip install -e ".[build,dev]"

      - name: Verify release version matches the tag
        run: python tools/check_release_version.py

      - name: Run tests
        run: python -m pytest

      - name: Build standalone executable
        run: >-
          pyinstaller --noconfirm --clean --onefile --console
          --name cxxman --paths src --specpath build/pyinstaller
          --collect-data certifi --collect-submodules pygments.lexers
          src/cxxman/__main__.py

      - name: Smoke test executable
        run: python tools/smoke_executable.py dist/cxxman.exe

      - name: Assemble release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item dist/cxxman.exe release/cxxman.exe
          Copy-Item scripts/install.ps1 release/install.ps1
          Copy-Item scripts/uninstall.ps1 release/uninstall.ps1
          Copy-Item docs/release.md release/README.md
          Compress-Archive -Path release/* -DestinationPath dist/cxxman-windows-x64.zip -Force
          $hash = (Get-FileHash dist/cxxman-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cxxman-windows-x64.zip" | Out-File -FilePath dist/cxxman-windows-x64.zip.sha256 -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          files: |
            dist/cxxman-windows-x64.zip
            dist/cxxman-windows-x64.zip.sha256
