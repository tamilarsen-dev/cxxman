name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
          - name: windows-msvc-x64
            os: windows-2022
            arch: x64
          - name: windows-msvc-x86
            os: windows-2022
            arch: Win32
            build_only: true
          - name: macos-appleclang
            os: macos-14
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: cmake --preset dev ${{ matrix.arch && format('-A {0}', matrix.arch) || '' }}

      - name: Build
        run: cmake --build --preset dev

      - name: Test
        if: ${{ !matrix.build_only }}
        run: ctest --preset dev
