name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-24.04
            cc: gcc-13
            cxx: g++-13
          - name: linux-clang
            os: ubuntu-24.04
            cc: clang-18
            cxx: clang++-18
          - name: windows-msvc-x64
            os: windows-2022
            arch: x64
          - name: windows-msvc-x86
            os: windows-2022
            arch: Win32
            build_only: true
          - name: macos-appleclang
            os: macos-15
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7

      # The build lints data/; with CXXMAN_CHECK_SNIPPETS it also compiles every
      # card example and recipe variant (PLAN 5.5).
      - name: Configure
        shell: bash
        run: >
          cmake --preset dev
          ${{ matrix.arch && format('-A {0}', matrix.arch) || '' }}
          -DCXXMAN_CHECK_SNIPPETS=${{ matrix.build_only && 'OFF' || 'ON' }}

      - name: Build and compile snippets
        run: cmake --build --preset dev

      - name: Test
        if: ${{ !matrix.build_only }}
        run: ctest --preset dev

      # The real binary's --json output parses (PLAN 10), misses included.
      - name: Smoke --json
        if: ${{ !matrix.build_only }}
        shell: bash
        run: |
          exe=build/dev/Debug/cxxman.exe
          [ -f "$exe" ] || exe=build/dev/cxxman
          py=$(command -v python || command -v python3)
          check() {
            want=$1; shift
            code=0
            "$exe" "$@" --json > smoke.json || code=$?
            [ "$code" -eq "$want" ] || { echo "cxxman $* --json: exit $code, want $want"; exit 1; }
            "$py" -m json.tool smoke.json > /dev/null || { echo "cxxman $* --json: not JSON"; exit 1; }
          }
          check 0 sort
          check 0 vector
          check 0 istringstream
          check 1 srot
          check 0 -s remove duplicates
          check 1 -s zzzz
          check 0 -H algorithm
          check 1 -H algoritm
